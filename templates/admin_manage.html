{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h4 class="mb-4 fw-bold">内容管理（已通过的地点）</h4>

  {% if places %}
  <div class="table-responsive bg-white p-3 rounded shadow-sm">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>缩略图</th>
          <th>名称</th>
          <th>分类</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        {% for place in places %}
        <tr>
          <td>
            {% if place.cover_image_url %}
            <img src="{{ place.cover_image_url }}" alt="{{ place.name }}" style="width:64px;height:64px;object-fit:cover;" class="rounded">
            {% else %}
            <span class="text-muted small">无图</span>
            {% endif %}
          </td>
          <td>
            <a href="{{ url_for('place_detail', id=place.id) }}" class="text-decoration-none fw-bold">{{ place.name }}</a>
          </td>
          <td>
             <!-- 用 category_id 判断即可，或者直接显示 -->
             <span class="badge bg-primary">{{ place.category_id }}</span>
          </td>
          <td>
            <form method="POST" action="{{ url_for('place_delete', id=place.id) }}" class="d-inline"
                  onsubmit="var r = prompt('请输入违规删除理由：'); if (r === null) return false; if (!r.trim()) { alert('必须填写删除理由'); return false; } this.reason.value = r; return true;">
              <input type="hidden" name="reason" value="">
              <button type="submit" class="btn btn-sm btn-danger">违规删除</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <div class="alert alert-info">暂无已通过的地点。</div>
  {% endif %}
</div>
{% endblock %}
