{% extends 'base.html' %}

{% block title %}注册 - 校园推荐系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">用户注册</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('register') }}" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="请输入用户名（唯一）" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="请输入密码" required>
                    </div>

                    <div class="mb-3">
                        <label for="nickname" class="form-label">昵称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nickname" name="nickname"
                               placeholder="请输入显示用昵称" required>
                    </div>

                    <div class="mb-3">
                        <label for="cohort" class="form-label">届别 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="cohort" name="cohort"
                               placeholder="例如：2023级 / 2024届" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">注册</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center text-muted">
                已有账号？<a href="{{ url_for('login') }}">立即登录</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
